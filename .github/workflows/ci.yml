# Continuous Integration: GitHub runs these checks on every push and pull request.
# A red ❌ on GitHub means one of the steps below failed. Click it to see which one.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint (find likely bugs)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check all packages
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the dashboard
        run: npm run build -w frontend
