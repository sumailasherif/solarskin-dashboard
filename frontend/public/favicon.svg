    <clipPath id="sun"><circle cx="319.5" cy="220" r="119"/></clipPath>
  </defs>
  <circle cx="320" cy="320" r="320" fill="#13223a"/>
  <g transform="translate(320 320) scale(1.45) translate(-320 -202)" fill="#f5b82e">
    <g clip-path="url(#sun)">
      <rect x="190" y="98" width="50" height="185.5"/>
      <rect x="255" y="98" width="26" height="185.5"/>
      <rect x="296" y="98" width="25" height="185.5"/>
      <rect x="336" y="98" width="26" height="185.5"/>
      <rect x="377" y="98" width="73" height="185.5"/>
    </g>
    <rect x="210" y="295" width="221" height="9" rx="4.5"/>
  </g>
</svg>
