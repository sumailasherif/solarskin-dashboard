<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <!-- SolarSkin logo mark on the navy logo circle.
       Same shapes and proportions as src/components/LogoMark.tsx, just scaled up. -->
  <defs>
    <!-- The sun circle, cut off flat at y = 442 -->
    <clipPath id="sun"><rect x="0" y="0" width="640" height="442"/></clipPath>
    <clipPath id="dome" clip-path="url(#sun)"><circle cx="320" cy="339" r="170"/></clipPath>
  </defs>
  <circle cx="320" cy="320" r="320" fill="#13223a"/>
  <!-- Five solar panels with thin gaps between them -->
  <g clip-path="url(#dome)" fill="#f5b82e">
    <rect x="149" y="160" width="69" height="282"/>
    <rect x="236" y="160" width="44" height="282"/>
    <rect x="298" y="160" width="44" height="282"/>
    <rect x="360" y="160" width="44" height="282"/>
    <rect x="422" y="160" width="69" height="282"/>
  </g>
  <!-- Base line -->
  <rect x="157" y="456" width="326" height="16" rx="8" fill="#f5b82e"/>
</svg>
