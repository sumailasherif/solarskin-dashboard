<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <!-- SolarSkin logo mark on the navy logo circle.
       Shapes measured from the official logo (same numbers as src/components/LogoMark.tsx),
       enlarged 1.45× so it is readable as a tiny browser-tab icon. -->
